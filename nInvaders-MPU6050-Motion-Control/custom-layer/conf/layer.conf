# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "customlayer"
BBFILE_PATTERN_customlayer = "^${LAYERDIR}/"
BBFILE_PRIORITY_customlayer = "6"

LAYERDEPENDS_customlayer = "core"
LAYERSERIES_COMPAT_customlayer = "kirkstone"
